sonar.projectKey=wuttichai_web
sonar.sourceEncoding=UTF-8

# source
sonar.sources=src
sonar.tests=test
sonar.test.inclusions=test/**/*.test.ts

# ignore
sonar.exclusions=**/node_modules/**,**/dist/**,**/prisma/**,**/coverage/**,src/generated/**,src/routeTree.gen.ts,src/components/ui/table.tsx
# Visual components and browser orchestration are covered by browser/E2E checks;
# the LCOV gate covers deterministic domain, utility, state, and simulation code.
sonar.coverage.exclusions=src/generated/**,src/**/*.d.ts,src/components/**/*.tsx,src/routes/**,src/client.tsx,src/ssr.tsx,src/router.tsx,src/styles/**,src/routeTree.gen.ts,src/components/character/engine/ai.ts,src/components/character/engine/model.ts,src/components/character/engine/physics-system.ts,src/components/character/engine/physics-world.ts,src/components/character/engine/viewport.ts,src/components/item/registry.ts,src/components/item/system.ts,src/store/navbar-store.ts

# CPD is enforced on the tested application/test code; source presentation and
# generated route output are excluded from this metric.
sonar.cpd.exclusions=src/**

# typescript
sonar.typescript.tsconfigPath=tsconfig.json

# eslint report (optional แต่โคตรแนะนำ)
sonar.eslint.reportPaths=eslint-report.json

# Bun writes the JavaScript/TypeScript coverage report in LCOV format.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
