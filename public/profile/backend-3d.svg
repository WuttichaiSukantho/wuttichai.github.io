<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Backend engineering in motion</title>
  <desc id="hero-desc">A perspective-projected wireframe cube rotates around an API core beside the words Clear architecture, reliable systems. A terminal cursor and moving signals add subtle motion.</desc>
